name: Final visual parity polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final visual parity fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          explorer_path = Path('components/PlaceExplorer.tsx')
          explorer = explorer_path.read_text(encoding='utf-8')
          old_busy = 'if (sort === "busy") return crowdRank[b.crowd.level] - crowdRank[a.crowd.level] || b.score - a.score;'
          new_busy = 'if (sort === "busy") return crowdRank[b.crowd.level] - crowdRank[a.crowd.level] || a.name.localeCompare(b.name, "ko-KR");'
          old_relaxed = 'if (sort === "relaxed") return crowdRank[a.crowd.level] - crowdRank[b.crowd.level] || b.score - a.score;'
          new_relaxed = 'if (sort === "relaxed") return crowdRank[a.crowd.level] - crowdRank[b.crowd.level] || a.name.localeCompare(b.name, "ko-KR");'
          if old_busy not in explorer or old_relaxed not in explorer:
              raise SystemExit('sort replacement target missing')
          explorer = explorer.replace(old_busy, new_busy, 1).replace(old_relaxed, new_relaxed, 1)
          explorer_path.write_text(explorer, encoding='utf-8')

          places_path = Path('data/places.ts')
          places = places_path.read_text(encoding='utf-8')
          old_name = '    name: override?.name ?? row.area_nm,'
          new_name = '    name: row.area_nm,'
          if old_name not in places:
              raise SystemExit('official name replacement target missing')
          places_path.write_text(places.replace(old_name, new_name, 1), encoding='utf-8')

          css_path = Path('app/radar.css')
          css = css_path.read_text(encoding='utf-8')
          marker = 'FINAL_MARKER_BUTTON_RESET'
          if marker not in css:
              css += '\n/* FINAL_MARKER_BUTTON_RESET */\n.radar-marker{border:0;padding:0;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer}\n'
          css_path.write_text(css, encoding='utf-8')

          Path('.github/workflows/final-polish.yml').unlink()
          PY
      - name: Verify production build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit final visual polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove map marker boxes and match reference ordering"
          git push origin HEAD:main
