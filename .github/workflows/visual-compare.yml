name: Visual compare capture

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Capture reference and current deployment
        run: |
          mkdir -p visual-captures
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import path from 'node:path';

          const targets = [
            { name: 'reference', url: 'https://gjdong.vercel.app/crowd' },
            { name: 'current', url: 'https://jigeum-eodi-seoul-live.vercel.app' },
          ];
          const sizes = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
          ];

          const browser = await chromium.launch({ headless: true });
          for (const size of sizes) {
            const context = await browser.newContext({
              viewport: { width: size.width, height: size.height },
              deviceScaleFactor: 1,
              locale: 'ko-KR',
            });
            const page = await context.newPage();
            for (const target of targets) {
              const response = await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(10000);
              await page.screenshot({
                path: path.join('visual-captures', `${target.name}-${size.name}.png`),
                fullPage: true,
              });
              const bodyText = await page.locator('body').innerText().catch(() => '');
              const title = await page.title().catch(() => '');
              await Bun?.write?.('', '').catch?.(() => {});
              console.log(JSON.stringify({ target: target.name, size: size.name, status: response?.status(), title, body: bodyText.slice(0, 2000) }));
            }
            await context.close();
          }
          await browser.close();
          EOF
          sed -i "/Bun?.write/d" /tmp/capture.mjs
          node /tmp/capture.mjs | tee visual-captures/capture-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: visual-compare
          path: visual-captures
          if-no-files-found: error
