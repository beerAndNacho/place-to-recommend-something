name: Visual compare capture

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Capture reference and final deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-captures
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import path from 'node:path';
          import { writeFile } from 'node:fs/promises';

          const currentUrl = 'https://seoul-crowd-radar-v3.vercel.app';
          const targets = [
            { name: 'reference', url: 'https://gjdong.vercel.app/crowd' },
            { name: 'current', url: currentUrl },
          ];
          const sizes = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
          ];

          async function loadWithRetry(page, url) {
            let response;
            for (let attempt = 1; attempt <= 36; attempt += 1) {
              response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(() => undefined);
              if (response?.status() === 200 && !page.url().includes('/login')) return response;
              await page.waitForTimeout(5000);
            }
            return response;
          }

          const browser = await chromium.launch({ headless: true });
          const records = [];
          for (const size of sizes) {
            const context = await browser.newContext({
              viewport: { width: size.width, height: size.height },
              deviceScaleFactor: 1,
              locale: 'ko-KR',
            });
            const page = await context.newPage();
            for (const target of targets) {
              const response = await loadWithRetry(page, target.url);
              await page.waitForTimeout(10000);
              await page.screenshot({
                path: path.join('visual-captures', `${target.name}-${size.name}.png`),
                fullPage: true,
              });
              const bodyText = await page.locator('body').innerText().catch(() => '');
              const title = await page.title().catch(() => '');
              const record = { target: target.name, size: size.name, status: response?.status(), title, body: bodyText.slice(0, 3000) };
              records.push(record);
              console.log(JSON.stringify(record));
              if (target.name === 'current') {
                if (response?.status() !== 200) throw new Error(`final deployment returned ${response?.status()}`);
                for (const marker of ['서울 인파레이더', '발달상권', '인구밀집지역', '고궁·문화유산']) {
                  if (!bodyText.includes(marker)) throw new Error(`missing UI marker: ${marker}`);
                }
              }
            }
            await context.close();
          }

          const apiContext = await browser.newContext();
          const apiPage = await apiContext.newPage();
          const apiResponse = await loadWithRetry(apiPage, `${currentUrl}/api/places`);
          const payload = JSON.parse(await apiPage.locator('body').innerText());
          if (apiResponse?.status() !== 200) throw new Error(`places API returned ${apiResponse?.status()}`);
          if (!Array.isArray(payload.places) || payload.places.length !== 121) {
            throw new Error(`expected 121 places, got ${payload.places?.length}`);
          }
          console.log(`VERIFIED_PLACE_COUNT=${payload.places.length}`);
          await writeFile('visual-captures/capture-log.json', JSON.stringify({ records, placeCount: payload.places.length }, null, 2));
          await apiContext.close();
          await browser.close();
          EOF
          node capture.mjs | tee visual-captures/capture-log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: visual-compare
          path: visual-captures
          if-no-files-found: error
