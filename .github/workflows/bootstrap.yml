name: Bootstrap verified MVP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore project source
        shell: bash
        run: |
          cat .bootstrap/archive.part* > /tmp/place-project.b64
          base64 --decode /tmp/place-project.b64 > /tmp/place-project.tar.xz
          xz --test /tmp/place-project.tar.xz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          tar -xJf /tmp/place-project.tar.xz -C .

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified project
        shell: bash
        run: |
          rm -rf node_modules .next
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Seoul crowd recommendation MVP"
          git push origin HEAD:main
