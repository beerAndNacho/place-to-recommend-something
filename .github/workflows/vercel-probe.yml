name: Vercel URL probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Vercel response
        shell: bash
        run: |
          set -euo pipefail
          url="https://jigeum-eodi-live-9htx3wmlv-luckykkh777-9155s-projects.vercel.app"
          for attempt in $(seq 1 6); do
            status=$(curl -L -sS --max-time 20 -o /tmp/page.html -w '%{http_code}' "$url" || true)
            echo "attempt=$attempt status=$status"
            if [[ "$status" == "200" ]] && grep -q '지금어디 배포 연결 확인' /tmp/page.html; then
              echo "VERCEL_URL_OK=$url"
              exit 0
            fi
            cat /tmp/page.html || true
            sleep 5
          done
          exit 1
