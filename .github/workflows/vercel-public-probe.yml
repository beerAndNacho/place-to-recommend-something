name: Vercel public URL probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify full public Vercel app
        shell: bash
        run: |
          set -u
          url="https://jigeum-eodi-seoul.vercel.app"
          for attempt in $(seq 1 30); do
            home_status=$(curl -L -sS --max-time 25 -o /tmp/home.html -w '%{http_code}' "$url" || true)
            health_status=$(curl -L -sS --max-time 25 -o /tmp/health.json -w '%{http_code}' "$url/api/health" || true)
            title=$(grep -oi '<title[^>]*>[^<]*' /tmp/home.html | head -1 || true)
            echo "attempt=$attempt home=$home_status health=$health_status title=$title"
            if [[ "$home_status" == "200" && "$health_status" == "200" ]] \
              && grep -Eq '지금어디|지금 어디' /tmp/home.html \
              && grep -qi 'mock' /tmp/health.json \
              && ! grep -qi 'Login – Vercel' /tmp/home.html; then
              echo "PUBLIC_FULL_APP_OK=$url"
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo '--- final homepage title/body marker ---'
          grep -oi '<title[^>]*>[^<]*' /tmp/home.html | head -1 || true
          echo '--- final health response ---'
          cat /tmp/health.json || true
          exit 1
