name: Vercel public URL probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify compact public Vercel application
        shell: bash
        run: |
          set -euo pipefail
          url="https://jigeum-eodi-seoul-live.vercel.app"
          for attempt in $(seq 1 24); do
            home_status=$(curl -L -sS --max-time 20 -o /tmp/home.html -w '%{http_code}' "$url" || true)
            health_status=$(curl -L -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$url/api/health" || true)
            echo "attempt=$attempt home=$home_status health=$health_status"
            if [[ "$home_status" == "200" && "$health_status" == "200" ]] \
              && grep -q '지금어디 로딩 중' /tmp/home.html \
              && grep -q 'compact-functional-demo' /tmp/health.json \
              && ! grep -qi 'Login – Vercel' /tmp/home.html; then
              break
            fi
            sleep 5
          done
          [[ "$home_status" == "200" && "$health_status" == "200" ]]
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          loader = Path('/tmp/home.html').read_text(encoding='utf-8')
          match = re.search(r"const b='([^']+)'", loader)
          assert match, 'embedded application payload missing'
          app = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          required = [
              'JIGEUM_EODI_COMPACT_APP_OK',
              '서울숲',
              'navigator.geolocation',
              '혼잡도',
              '지금 갈 곳',
          ]
          missing = [item for item in required if item not in app]
          assert not missing, f'missing markers: {missing}'
          print('PUBLIC_FUNCTIONAL_URL_OK=https://jigeum-eodi-seoul-live.vercel.app')
          print(f'DECOMPRESSED_APP_BYTES={len(app.encode("utf-8"))}')
          PY
          cat /tmp/health.json
