name: Vercel public URL probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public functional Vercel deployment
        shell: bash
        run: |
          set -u
          url="https://jigeum-eodi-seoul-now.vercel.app"
          for attempt in $(seq 1 24); do
            home_status=$(curl -L -sS --max-time 20 -o /tmp/home.html -w '%{http_code}' "$url" || true)
            health_status=$(curl -L -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$url/api/health" || true)
            title=$(grep -oi '<title[^>]*>[^<]*' /tmp/home.html | head -1 || true)
            echo "attempt=$attempt home=$home_status health=$health_status title=$title"
            if [[ "$home_status" == "200" && "$health_status" == "200" ]] \
              && grep -q '지금어디 로딩 중' /tmp/home.html \
              && grep -q 'static-functional-demo' /tmp/health.json \
              && ! grep -qi 'Login – Vercel' /tmp/home.html; then
              echo "PUBLIC_FUNCTIONAL_URL_OK=$url"
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo '--- homepage ---'
          head -c 500 /tmp/home.html || true
          echo
          echo '--- health ---'
          cat /tmp/health.json || true
          exit 1
