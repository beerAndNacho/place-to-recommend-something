name: Final reference parity refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Align filters, rows and marker styling with reference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new, 1)

          explorer_path = Path("components/PlaceExplorer.tsx")
          explorer = explorer_path.read_text(encoding="utf-8")
          explorer = replace_once(
              explorer,
              'import type { CrowdLevel, Place, PlaceCategory, PlacesPayload, RankedPlace } from "@/types/place";',
              'import type { CrowdLevel, Place, PlacesPayload, RankedPlace } from "@/types/place";',
              "type import",
          )
          explorer = replace_once(
              explorer,
              '  { value: "quiet", label: "한적한 곳", icon: "☁" },\n',
              '',
              "quiet preset",
          )
          explorer = replace_once(
              explorer,
              '''const categories: Array<{ value: "all" | PlaceCategory; label: string }> = [
  { value: "all", label: "전체" },
  { value: "walk", label: "공원·산책" },
  { value: "hotspot", label: "상권·핫플" },
  { value: "photo", label: "문화·사진" },
  { value: "night", label: "야간" },
  { value: "family", label: "가족" },
];''',
              '''type OfficialAreaCategory = "발달상권" | "인구밀집지역" | "관광특구" | "공원" | "고궁·문화유산";

const categories: Array<{ value: "all" | OfficialAreaCategory; label: string }> = [
  { value: "all", label: "전체" },
  { value: "발달상권", label: "발달상권" },
  { value: "인구밀집지역", label: "인구밀집지역" },
  { value: "관광특구", label: "관광특구" },
  { value: "공원", label: "공원" },
  { value: "고궁·문화유산", label: "고궁·문화유산" },
];''',
              "official categories",
          )
          explorer = replace_once(
              explorer,
              '''function placeType(place: Place): string {
  if (place.categories.includes("walk") || place.categories.includes("quiet")) return "공원·산책";
  if (place.categories.includes("hotspot")) return "발달상권";
  if (place.categories.includes("photo")) return "문화·관광";
  return "인구밀집지역";
}''',
              '''function placeType(place: Place): string {
  const officialTypes: OfficialAreaCategory[] = [
    "발달상권",
    "인구밀집지역",
    "관광특구",
    "공원",
    "고궁·문화유산",
  ];
  return officialTypes.find((type) => place.searchKeywords.includes(type))
    ?? (place.categories.includes("walk") ? "공원" : "발달상권");
}''',
              "place type",
          )
          explorer = replace_once(
              explorer,
              '  const [category, setCategory] = useState<"all" | PlaceCategory>("all");',
              '  const [category, setCategory] = useState<"all" | OfficialAreaCategory>("all");',
              "category state",
          )
          explorer = replace_once(
              explorer,
              '        if (category !== "all" && !place.categories.includes(category)) return false;',
              '        if (category !== "all" && !place.searchKeywords.includes(category)) return false;',
              "category filter",
          )
          explorer = replace_once(
              explorer,
              '''                      <small>
                        {placeType(place)}
                        <span>·</span>
                        {place.district}
                        {place.distanceKm != null && <><span>·</span>{place.distanceKm.toFixed(1)}km</>}
                      </small>''',
              '''                      <small>
                        {placeType(place)}
                        {place.distanceKm != null && <><span>·</span>{place.distanceKm.toFixed(1)}km</>}
                      </small>''',
              "row metadata",
          )
          explorer = replace_once(
              explorer,
              '                    <span className="radar-row__population">{formatPopulationRange(place.crowd.minPopulation, place.crowd.maxPopulation)}</span>\n',
              '',
              "row population",
          )
          explorer_path.write_text(explorer, encoding="utf-8")

          places_path = Path("data/places.ts")
          places = places_path.read_text(encoding="utf-8")
          places = replace_once(
              places,
              '    searchKeywords: override?.searchKeywords ?? [row.area_nm, row.category, "서울"],',
              '    searchKeywords: [...(override?.searchKeywords ?? [row.area_nm, "서울"]), row.category],',
              "official category metadata",
          )
          places_path.write_text(places, encoding="utf-8")

          css_path = Path("app/radar.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "REFERENCE_PARITY_REFINEMENTS"
          if marker not in css:
              css += '''

/* REFERENCE_PARITY_REFINEMENTS */
.radar-brand strong{font-family:"Noto Serif CJK KR","Noto Serif KR",Batang,serif;font-weight:800}
.radar-row__main{grid-template-columns:27px minmax(0,1fr) auto}
.radar-row__population{display:none!important}
.radar-marker{filter:drop-shadow(0 1px 2px #14202e24)}
.radar-marker__dot{width:13px;height:13px;border-width:1.5px}
.radar-marker__label{max-width:132px;margin-left:3px;padding:2px 6px;border-radius:4px;font-size:8px;line-height:14px}
@media(max-width:760px){.radar-marker__label{max-width:116px;font-size:7px}.radar-row,.radar-row__main{min-height:58px}}
'''
          css_path.write_text(css, encoding="utf-8")

          for temporary in [
              Path(".github/workflows/refine-reference-ui.yml"),
              Path(".github/workflows/fetch-seoul-spots.yml"),
          ]:
              if temporary.exists():
                  temporary.unlink()
          PY
      - name: Verify production build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit final parity refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align crowd dashboard filters and density with reference"
          git push origin HEAD:main
