name: Parse-safe reference parity refinement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply parity patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/refine_patch.py
          python /tmp/refine_patch.py
      - name: Verify production build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit parity refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align crowd dashboard filters and density with reference"
          git push origin HEAD:main
