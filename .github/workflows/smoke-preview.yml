name: Preview smoke test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed homepage and health API
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://place-to-recommend-something-lfsracq3w.vercel.app"
          for attempt in $(seq 1 24); do
            home_status=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' "$base_url" || true)
            health_status=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' "$base_url/api/health" || true)
            echo "attempt=$attempt homepage=$home_status health=$health_status"
            if [[ "$home_status" == "200" && "$health_status" == "200" ]] && grep -q '지금 어디' /tmp/home.html && grep -q 'mock' /tmp/health.json; then
              echo "Preview deployment smoke test passed"
              exit 0
            fi
            sleep 5
          done
          echo '--- homepage response ---'
          cat /tmp/home.html || true
          echo '--- health response ---'
          cat /tmp/health.json || true
          exit 1
