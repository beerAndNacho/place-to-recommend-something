name: Apply 121-place Seoul dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Download prepared TypeScript blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1"
            local output="$2"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d > "$output"
          }
          fetch_blob "b249a94501cb4b6fc7449d9517b14ceb413dafa7" "data/places.ts"
          fetch_blob "b33916980eb46a4aa79004f49f7b69c9743c5ec7" "lib/place-service.ts"
      - name: Fetch official Seoul hotspot metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fetch-hotspots.mjs <<'EOF'
          import { writeFile } from 'node:fs/promises';

          const endpoint = 'https://data.seoul.go.kr/SeoulRtd/api/hotspot-category';
          const headers = {
            'User-Agent': 'Mozilla/5.0 (compatible; SeoulCrowdRadarMetadata/1.0)',
            Referer: 'https://data.seoul.go.kr/SeoulRtd/map',
            Accept: 'application/json, text/plain, */*',
          };
          const rows = [];
          for (const page of [1, 2, 3]) {
            const url = new URL(endpoint);
            url.searchParams.set('page', String(page));
            url.searchParams.set('category', '전체보기');
            url.searchParams.set('count', '50');
            url.searchParams.set('sort', 'false');
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`page ${page}: HTTP ${response.status}`);
            const payload = await response.json();
            if (!Array.isArray(payload.row)) throw new Error(`page ${page}: missing row`);
            rows.push(...payload.row);
          }
          const unique = [...new Map(rows.filter((row) => row.area_nm).map((row) => [row.area_nm, row])).values()];
          if (unique.length !== 121) throw new Error(`expected 121 hotspots, got ${unique.length}`);
          await writeFile('data/seoul-hotspots.json', `${JSON.stringify(unique, null, 2)}\n`);
          console.log(`HOTSPOT_COUNT=${unique.length}`);
          EOF
          node /tmp/fetch-hotspots.mjs
      - name: Verify production build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit generated dashboard source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seoul-hotspots.json data/places.ts lib/place-service.ts
          git commit -m "feat: show all 121 Seoul hotspots in the crowd dashboard"
          git push origin HEAD:main
